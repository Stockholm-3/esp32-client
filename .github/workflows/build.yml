name: Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Firmware (esp32s3)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Cache Espressif Toolchains
        id: cache-espressif-tools
        uses: actions/cache@v4
        with:
          path: /home/runner/.espressif
          key: espressif-tools-${{ hashFiles('flake.lock') }}

      - name: Cache Managed Components
        uses: actions/cache@v4
        with:
          path: managed_components
          key: managed-components-${{ hashFiles('**/idf_component.yml') }}
          restore-keys: managed-components-

      - name: Cache Build Objects
        uses: actions/cache@v4
        with:
          path: build
          key: build-esp32s3-${{ hashFiles('main/**', 'components/**', '**/CMakeLists.txt', 'sdkconfig.defaults') }}
          restore-keys: build-esp32s3-

      - name: Build Firmware
        run: |
          nix develop . --command bash -c "idf.py set-target esp32s3 && idf.py build && idf.py size-components"

      - name: Upload Firmware Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3-${{ github.sha }}
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/flasher_args.json
          retention-days: 30

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build/CMakeFiles/**/*.log
            build/**/*.log
          retention-days: 7
