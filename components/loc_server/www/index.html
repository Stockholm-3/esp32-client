<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Settings</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Device Settings</h1>
        <div class="status-bar">
            <span class="dot disconnected" id="ws-dot"></span>
            <span id="ws-label">Connecting...</span>
        </div>

        <div class="row">
            <div class="row-info">
                <div class="title">WiFi</div>
                <div class="sub" id="wifi-state-lbl"></div>
            </div>
            <div class="inputs">
                <button onclick="scanWifi()">Scan networks</button>
                <select id="sel-ssid"><option value="">-- select network --</option></select>
                <input id="inp-pass" type="password" placeholder="Password">
                <button onclick="applyWifi()">Apply</button>
            </div>
        </div>

        <div class="row">
            <div class="row-info">
                <div class="title">Location</div>
                <div class="sub">City for weather data</div>
            </div>
            <input id="inp-location" type="text" placeholder="Enter city..."
                   onchange="sendSettings()">
        </div>

        <div class="row">
            <div class="row-info">
                <div class="title">Price zone</div>
                <div class="sub">Swedish electricity zone</div>
            </div>
            <select id="sel-price" onchange="sendSettings()">
                <option>SE1</option><option>SE2</option>
                <option>SE3</option><option>SE4</option>
            </select>
        </div>

        <div class="row">
            <div class="row-info">
                <div class="title">Screen timeout</div>
                <div class="sub">Auto dim after inactivity</div>
            </div>
            <select id="sel-timeout" onchange="sendSettings()">
                <option>5 min</option><option>10 min</option>
                <option>15 min</option><option>20 min</option>
                <option>Never</option>
            </select>
        </div>

        <div class="row">
            <div class="row-info">
                <div class="title">Local web client</div>
                <div class="sub">Fixed IP for home network access</div>
            </div>
            <label class="toggle">
                <input type="checkbox" id="chk-lwc" onchange="sendNetworkConfig()">
                <span class="slider"></span>
            </label>
        </div>

        <div id="ip-config-block" class="ip-block" style="display:none">
            <div class="ip-row">
                <label>Static IP</label>
                <input id="inp-ip" type="text" placeholder="e.g. 10.0.0.100" maxlength="15">
            </div>
            <div class="ip-row">
                <label>Gateway</label>
                <input id="inp-gw" type="text" placeholder="e.g. 10.0.0.1" maxlength="15">
            </div>
            <div class="ip-row">
                <label>Netmask</label>
                <input id="inp-nm" type="text" placeholder="255.255.255.0" maxlength="15">
            </div>
            <div class="ip-row">
                <label>mDNS hostname</label>
                <input id="inp-host" type="text" placeholder="esp32-client" maxlength="32"
                       oninput="updateMdnsHint()">
                <span class="mdns-hint" id="mdns-hint"></span>
            </div>
            <button onclick="saveNetworkConfig()">Save &amp; Reboot</button>
        </div>
    </div>

    <div id="reboot-overlay" style="display:none">
        <div class="reboot-box">
            <div>Applying settings...</div>
            <div class="sub">Device is restarting. Reconnect in ~5 seconds.</div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
