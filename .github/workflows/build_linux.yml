name: Simulator Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: ["**"]
  workflow_dispatch: # Allows manual triggering

concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_linux:
    name: Simulator (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Cache Espressif Toolchains
        id: cache-espressif-tools
        uses: actions/cache@v4
        with:
          path: /home/runner/.espressif
          key: espressif-tools-${{ hashFiles('flake.lock') }}

      - name: Cache Managed Components
        uses: actions/cache@v4
        with:
          path: simulator/managed_components
          key: managed-components-sim-${{ hashFiles('**/idf_component.yml') }}
          restore-keys: managed-components-sim-

      - name: Build Simulator
        run: |
          nix develop . --command bash -c "make linux-reconfigure && make linux-build"

      - name: Upload Simulator Binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-linux-${{ github.sha }}
          path: |
            simulator/build/simulator.elf
          retention-days: 7

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-build-logs-${{ github.sha }}
          path: |
            simulator/build/CMakeFiles/**/*.log
            simulator/build/**/*.log
